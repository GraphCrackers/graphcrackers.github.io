<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><!-- 정식 공개 시 이 줄 삭제 -->

<title>ARETE PROJECT | GraphCrackers</title>
<meta name="description" content="ARETE PROJECT — GraphCrackers 공식 웹사이트">

<meta property="og:type" content="website">
<meta property="og:url" content="https://graphcrackers.github.io/">
<meta property="og:title" content="ARETE PROJECT | GraphCrackers">
<meta property="og:description" content="ARETE PROJECT — GraphCrackers 공식 웹사이트">

<meta name="theme-color" content="#F3EEE2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3EEE2'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%231F1C18'%3EA%3C/text%3E%3C/svg%3E">

<!-- 폰트 조합: 라틴 대제목은 Noto Serif KR의 세리프 글리프로 정제된 인상을, 한글 부제목은 Pretendard로 모바일 가독성을 확보 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root{
    --bg: #F3EEE2;
    --ink: #1F1C18;
    --ink-soft: #3A352E;
    --font-latin: "Noto Serif KR", Georgia, "Times New Roman", serif;
    --font-ko: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    margin: 0;
    padding: 0;
    background: var(--bg);
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;      /* 폴백 */
    min-height: 100dvh;     /* 모바일 주소창 대응 */
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ko);
    overflow-x: hidden;
  }

  .stage {
    width: 100%;
    max-width: 60rem;
    text-align: center;
  }

  .title {
    margin: 0;
    font-family: var(--font-latin);
    font-weight: 600;
    font-size: clamp(1.375rem, 5.8vw, 4.25rem);
    line-height: 1.1;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    /* 마지막 글자 뒤에도 자간이 붙어 중심이 왼쪽으로 밀리는 현상 보정 */
    padding-left: 0.12em;
  }

  .subtitle {
    margin: clamp(0.875rem, 2.6vw, 1.5rem) 0 0;
    color: var(--ink-soft);
    font-weight: 500;
    font-size: clamp(0.9375rem, 3.3vw, 1.375rem);
    line-height: 1.6;
    letter-spacing: -0.01em;
    word-break: keep-all;   /* 한글 어절 단위 줄바꿈 */
  }

  /* 기본 비표시. 아래 HTML 주석을 해제하면 이 스타일이 적용된다 */
  .contact {
    margin: clamp(1.5rem, 4vw, 2.5rem) 0 0;
    color: var(--ink-soft);
    font-size: clamp(0.8125rem, 2.6vw, 0.9375rem);
    letter-spacing: 0.02em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CSS 애니메이션이므로 JS 없이도 재생되고, 재생이 끝나면 문구가 남는다 */
  .line { animation: rise 800ms cubic-bezier(.2,.6,.2,1) both; }
  .title    { animation-delay: 0ms; }
  .subtitle { animation-delay: 260ms; }
  .contact  { animation-delay: 520ms; }

  /* JS가 동작할 때만 부여되는 클래스. 폰트 로드 전까지 재생을 보류한다 */
  html.js-wait .line { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    .line { animation: none; }
  }
</style>

<script>
  (function () {
    var root = document.documentElement;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !document.fonts || !document.fonts.ready) return;

    root.classList.add('js-wait');

    var released = false;
    function release() {
      if (released) return;
      released = true;
      root.classList.remove('js-wait');
    }

    document.fonts.ready.then(release);
    setTimeout(release, 1200); /* 폰트 로드가 지연되어도 반드시 재생 */
  })();
</script>
</head>

<body>
  <main class="stage">
    <h1 class="line title">ARETE PROJECT</h1>
    <p class="line subtitle">AI 시대를 주도하는 핵심 역량은 무엇인가?</p>
    <!-- 문의 이메일 표시가 필요하면 아래 줄의 주석만 해제
    <p class="line contact">contact@graphcrackers.com</p>
    -->
  </main>
</body>
</html>
